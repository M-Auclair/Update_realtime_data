name: Update Realtime Water Level Data

on:
  schedule:
    # Run every ~ 3 hours on fixed sched
    - cron: '21 10 * * *' # 4:21 AM MDT
    - cron: '21 13 * * *' # 7:21 AM MDT
    - cron: '21 16 * * *' # 10:21 AM MDT
    - cron: '21 19 * * *' # 1:21 PM MDT
    - cron: '21 22 * * *' # 4:21 PM MDT
    - cron: '21 1 * * *'  # 7:21 PM MDT
    - cron: '21 4 * * *'  # 10:21 PM MDT
  workflow_dispatch:  

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # Required to push commits
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0  # Fetch all history for proper git operations
    
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.5.3'  
    
    - name: Install R dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          tidyhydat
          dplyr
          lubridate
        needs: |
          checkout
          setup-r
    
    - name: Run data update script
      timeout-minutes: 45
      run: |
        Rscript scripts/update_realtime_data.R
      env:
        TZ: UTC
    
    - name: Commit and push if changed
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/realtime_WL_data.rds
        git diff --staged --quiet || (git commit -m "Auto-update: Realtime water level data $(date +'%Y-%m-%d %H:%M:%S UTC')" && git push)