name: Update Realtime Water Level Data

on:
  schedule:
    # Run every 2 hours on fixed sched between 6am and 8pm MT
    - cron: '0 12 * * *' # 6:00 AM MST daily
    - cron: '0 15 * * *'  # 9:00 AM MST daily
    - cron: '0 18 * * *' # 12:00 PM MST daily
    - cron: '0 21 * * *' # 15:00
    - cron: '0 0 * * *' # 18:00
    - cron: '0 3 * * *' # 21:00
  workflow_dispatch:  # Allows manual triggering from GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # Required to push commits
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0  # Fetch all history for proper git operations
    
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.5.2'  
    
    - name: Install R dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          tidyhydat
          dplyr
          lubridate
        needs: |
          checkout
          setup-r
    
    - name: Run data update script
      timeout-minutes: 45
      run: |
        Rscript scripts/update_realtime_data.R
      env:
        TZ: UTC
    
    - name: Commit and push if changed
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/realtime_WL_data.rds
        git diff --staged --quiet || (git commit -m "Auto-update: Realtime water level data $(date +'%Y-%m-%d %H:%M:%S UTC')" && git push)